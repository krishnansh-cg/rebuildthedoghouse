<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Rebuild the Doghouse with Krish and Milo</title>
  <desc id="desc">A dimensional blue and yellow engineering game title shaped like a doghouse sign.</desc>
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39a9ff"/>
      <stop offset="0.5" stop-color="#126bd3"/>
      <stop offset="1" stop-color="#154777"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbd35"/>
      <stop offset="0.48" stop-color="#fca01b"/>
      <stop offset="1" stop-color="#d86b09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff16a"/>
      <stop offset="0.48" stop-color="#ffd21f"/>
      <stop offset="1" stop-color="#f7941d"/>
    </linearGradient>
    <linearGradient id="plaque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2784dd"/>
      <stop offset="1" stop-color="#154777"/>
    </linearGradient>
    <radialGradient id="bolt" cx="35%" cy="28%" r="70%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.42" stop-color="#d8e3eb"/>
      <stop offset="1" stop-color="#778d9f"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="14" stdDeviation="9" flood-color="#071f42" flood-opacity="0.5"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="3" flood-color="#082c5a" flood-opacity="0.72"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- doghouse roof -->
    <path d="M62 180L346 77L584 15Q600 10 616 15L854 77L1138 180"
      fill="none" stroke="#092f66" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62 170L346 67L584 5Q600 0 616 5L854 67L1138 170"
      fill="none" stroke="url(#roof)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M73 161L351 61L587 2Q600-1 613 2L849 61L1127 161"
      fill="none" stroke="#7bd1ff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>

    <!-- orange header plank -->
    <path d="M205 73Q195 73 191 84L177 151Q175 163 190 165L1010 165Q1025 163 1023 151L1009 84Q1005 73 995 73Z"
      fill="#9d4808" stroke="#0b3976" stroke-width="12"/>
    <path d="M207 67Q198 67 195 77L184 139Q182 149 195 151L1005 151Q1018 149 1016 139L1005 77Q1002 67 993 67Z"
      fill="url(#wood)" stroke="#ffcf5a" stroke-width="3"/>
    <path d="M225 91H975M218 126H982" stroke="#c85e08" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <!-- title depth and face -->
    <text x="600" y="132" text-anchor="middle" font-family="Arial Rounded MT Bold, Trebuchet MS, sans-serif"
      font-size="77" font-weight="900" letter-spacing="2" fill="#0a3979" stroke="#0a3979" stroke-width="15"
      paint-order="stroke" transform="translate(0 8)">REBUILD THE</text>
    <text x="600" y="132" text-anchor="middle" font-family="Arial Rounded MT Bold, Trebuchet MS, sans-serif"
      font-size="77" font-weight="900" letter-spacing="2" fill="#fff" stroke="#154777" stroke-width="6"
      paint-order="stroke" filter="url(#soft)">REBUILD THE</text>

    <text x="600" y="302" text-anchor="middle" font-family="Arial Rounded MT Bold, Trebuchet MS, sans-serif"
      font-size="170" font-weight="900" letter-spacing="-3" fill="#0a3979" stroke="#0a3979" stroke-width="30"
      paint-order="stroke" transform="translate(0 13)">DOGHOUSE</text>
    <text x="600" y="302" text-anchor="middle" font-family="Arial Rounded MT Bold, Trebuchet MS, sans-serif"
      font-size="170" font-weight="900" letter-spacing="-3" fill="url(#gold)" stroke="#1262c6" stroke-width="18"
      paint-order="stroke" filter="url(#soft)">DOGHOUSE</text>
    <!-- hanging character plaque -->
    <path d="M318 327V345M882 327V345" stroke="#d58618" stroke-width="12" stroke-linecap="round"/>
    <rect x="274" y="340" width="652" height="78" rx="22" fill="#082f68" stroke="#092f66" stroke-width="12"/>
    <rect x="278" y="334" width="644" height="78" rx="20" fill="url(#plaque)" stroke="#66c7ff" stroke-width="4"/>
    <text x="600" y="391" text-anchor="middle" font-family="Arial Rounded MT Bold, Trebuchet MS, sans-serif"
      font-size="53" font-weight="900" fill="#fff" stroke="#0b3e82" stroke-width="8" paint-order="stroke"
      filter="url(#soft)">with KRISH &amp; MILO</text>

    <!-- mechanical fasteners -->
    <g fill="url(#bolt)" stroke="#425a70" stroke-width="4">
      <circle cx="218" cy="106" r="15"/><circle cx="982" cy="106" r="15"/>
      <circle cx="105" cy="169" r="13"/><circle cx="1095" cy="169" r="13"/>
      <circle cx="305" cy="373" r="12"/><circle cx="895" cy="373" r="12"/>
    </g>
    <g stroke="#294053" stroke-width="4" stroke-linecap="round">
      <path d="M210 106H226M218 98V114M974 106H990M982 98V114"/>
      <path d="M98 169H112M105 162V176M1088 169H1102M1095 162V176"/>
      <path d="M299 373H311M305 367V379M889 373H901M895 367V379"/>
    </g>
  </g>
</svg>
